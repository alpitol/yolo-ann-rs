name: Release

# Push a tag like `v0.1.0` (matching the version in Cargo.toml) to build the
# binaries and publish them as a GitHub release. Running the workflow manually
# only builds the binaries and keeps them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest available Ubuntu, so the binary runs on older glibc versions too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: x86_64-linux }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: aarch64-linux }
          - { os: macos-latest, target: aarch64-apple-darwin, name: aarch64-macos }
          - { os: macos-latest, target: x86_64-apple-darwin, name: x86_64-macos }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: x86_64-windows, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check that the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          # Link the MSVC runtime statically so no VC++ redistributable is needed.
          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/yolo-ann${{ matrix.ext }}" \
            "dist/yolo-ann-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}${{ matrix.ext }}"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
