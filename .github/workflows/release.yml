name: Release

# Push a tag like `v0.1.0` (matching the version in Cargo.toml) to build the
# binaries and publish them as a GitHub release. Running the workflow manually
# only builds the archives and keeps them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest available Ubuntu, so the binary runs on older glibc versions too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check that the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          # Link the MSVC runtime statically so no VC++ redistributable is needed.
          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="yolo-ann-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "../target/${{ matrix.target }}/release/yolo-ann.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp "../target/${{ matrix.target }}/release/yolo-ann" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
